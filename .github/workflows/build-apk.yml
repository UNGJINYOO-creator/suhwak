name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Suhwak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Suhwak-apk
          path: Suhwak.apk

      # 앱 안 업데이트가 읽는 버전 정보: 빌드 번호 + 이번 커밋 제목 (앱 설정에 "무엇이 바뀌었는지"로 보임)
      - name: Write version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 -c "import json,os; print(json.dumps({'build': int(os.environ['GITHUB_RUN_NUMBER']), 'notes': '• ' + (os.environ.get('NOTES') or '').splitlines()[0] if os.environ.get('NOTES') else ''}, ensure_ascii=False))" > version.json
          cat version.json

      # Publishes each build on the Releases page so the APK can be downloaded straight to a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 수확중 빌드 ${{ github.run_number }}
          body: 태블릿·휴대폰에서 아래 Suhwak.apk를 눌러 받고 설치하세요. (설치 후에는 앱 설정의 업데이트로 받으면 돼요)
          files: |
            Suhwak.apk
            version.json
          make_latest: true
